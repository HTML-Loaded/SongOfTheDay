{% extends "base.html" %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}

<h2>Log In</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Log In </button>
</form>

<div class="auth-links">
  <a class="password-reset-link" href="{% url 'password_reset' %}">Password Reset</a>
  <a class="password-reset-link" href="{% url 'signup' %}">Sign Up</a>
</div>
{% endblock %}
