<!-- templates/password_reset_form.html -->
{% extends "base.html" %}

{% block content %}
<h2>Password Reset</h2>
<p>Forget your password? Enter your email and you'll recieve instructions on how to reset it.</p>
<form method="post">
  {% csrf_token %}
  {{ form }}
  <button type="submit">Reset</button>
</form>
{% endblock %}
