<!-- templates/password_reset_confirm.html -->
{% extends "base.html" %}

{% block content %}
<h2>Enter new password</h2>
<p>Please enter your new password so we can verify you typed it in correctly.</p>
<form method="post">
  {% csrf_token %}
  {{ form }}
  <button type="submit">Change my password</button>
</form>
{% endblock %}
