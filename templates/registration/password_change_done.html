<!-- templates/password_change_done.html -->
{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
  body {
    background: #000000;
  }

  .mobile-container {
    background: #000000;
    box-shadow: 0 10px 30px rgba(3, 19, 166, 0.35);
    border: 1px solid #6c5ce7;
  }

  .logo {
    width: 100%;
    max-width: 300px;
    margin: 0;
    display: block;
    filter: drop-shadow(0 10px 20px rgba(3, 19, 166, 0.25));
  }

  .logo-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
    margin-bottom: 10px;
    background: #000000;
  }

  h2 {
    margin: 0 0 14px;
    color: #FFFFFF;
    letter-spacing: 0.5px;
    text-align: center;
  }

  p {
    margin: 0 0 14px;
    color: #FFFFFF;
    opacity: 0.9;
    text-align: center;
  }

  a {
    width: 100%;
    max-width: 240px;
    padding: 10px 12px;
    font-size: 14px;
    background: #0313a6;
    border: 1px solid #0313a6;
    color: #FFFFFF;
  }

  a:hover {
    background: #6c5ce7;
    border-color: #6c5ce7;
    color: #FFFFFF;
  }

  .actions {
    display: flex;
    justify-content: center;
  }
</style>

<div class="logo-wrap">
  <img class="logo" src="{% static 'img/sotd-logo.png' %}" alt="Song Of The Day" />
</div>

<h2>Password Changed</h2>
<p>Your new password has been set. You may log in now</p>

<div class="actions">
  <a href="{% url 'login' %}">Log In</a>
</div>
{% endblock %}
