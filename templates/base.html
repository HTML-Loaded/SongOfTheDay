<!-- templates/base.html -->
<!--formatting for html pages-->

<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>{% block title %}Django Auth Tutorial{% endblock %}</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .mobile-container {
      width: 100%;
      max-width: 420px;
      height: 90vh;
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* shared UI styles */
    a {
      display: inline-block;
      padding: 12px;
      background: #2d6cdf;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      text-align: center;
    }
    a:hover {
      background: #1f56b8;
    }

    button {
      padding: 12px;
      border: none;
      text-decoration: none;
      border-radius: 10px;
      background: #2d6cdf;
      text-align: center;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1f56b8;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div class="mobile-container">
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>

</html>
