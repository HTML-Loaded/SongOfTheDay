<!-- templates/base.html -->

<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">

  <!-- Page title block: child templates override this -->
  <title>{% block title %}My App{% endblock %}</title>

  <!-- Required for Django static file resolution (logo, css, etc.) -->
  {% load static %}

  <style>
    /* ===== ROOT LAYOUT ===== */
    body {
      margin: 0;
      font-family: Arial, sans-serif;

      color: #FFFFFF;

      /* Full black background for neon theme */
      background: #000000;

      /* Center the mobile container horizontally + vertically */
      display: flex;
      justify-content: center;
      align-items: center;

      /* Ensures full viewport height coverage */
      min-height: 100vh;
    }

    /* ===== MAIN APP CONTAINER (SIMULATED MOBILE VIEW) ===== */
    .mobile-container {
      width: 100%;
      max-width: 420px;   /* locks layout to mobile width */
      height: 90vh;       /* prevents full screen overflow */

      background: #000000;

      /* rounded "phone-like" container */
      border-radius: 24px;

      /* neon glow shadow */
      box-shadow: 0 10px 30px rgba(3, 19, 166, 0.35);

      /* neon border */
      border: 1px solid #6c5ce7;

      padding: 30px 20px;

      display: flex;
      flex-direction: column;

      /* enables scrolling inside container only */
      overflow-y: auto;
      overflow-x: hidden;

      position: relative;
    }

    .mobile-container.has-bottom-nav {
      padding-bottom: 0;
    }

    .mobile-container::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 26px;
      background: linear-gradient(135deg, rgba(108, 92, 231, 0.65), rgba(16, 220, 172, 0.35), rgba(3, 19, 166, 0.55));
      filter: blur(14px);
      opacity: 0.7;
      z-index: -1;
      animation: borderGlow 7s ease-in-out infinite;
    }

    @keyframes borderGlow {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.01); }
    }

    /* ===== CUSTOM SCROLLBAR (NEON STYLE) ===== */
    .mobile-container {
      scrollbar-color: #6c5ce7 #0D0D0D;
      scrollbar-width: thin;
    }

    .mobile-container::-webkit-scrollbar {
      width: 10px;
    }

    .mobile-container::-webkit-scrollbar-track {
      background: #0D0D0D;
      border-radius: 999px;
    }

    .mobile-container::-webkit-scrollbar-thumb {
      background: #6c5ce7;
      border-radius: 999px;

      /* creates spacing illusion around thumb */
      border: 2px solid #0D0D0D;
    }

    .mobile-container::-webkit-scrollbar-thumb:hover {
      background: #10dcac; /* hover accent (green neon) */
    }

    /* ===== MAIN CONTENT AREA ===== */
    main {
      flex: 1;

      /* vertical stacking of page content */
      display: flex;
      flex-direction: column;

      /* centers content vertically when space allows */
      justify-content: center;
    }

    /* ===== LOGO SECTION ===== */
    .logo-wrap {
      width: 100%;

      /* horizontal centering of logo */
      display: flex;
      justify-content: center;

      margin-bottom: 10px;

      background: #000000;
    }

    .logo {
      width: 100%;
      max-width: 300px;
      margin: 0;
      display: block;

      /* glow effect under logo */
      filter: drop-shadow(0 10px 20px rgba(3, 19, 166, 0.25));
    }

    /* ===== HEADINGS ===== */
    h2 {
      margin: 0 0 18px;

      text-align: center;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #FFFFFF, #6c5ce7, #10dcac);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 18px rgba(108, 92, 231, 0.28), 0 0 26px rgba(16, 220, 172, 0.12);
      animation: titleShimmer 8s linear infinite;
    }

    @keyframes titleShimmer {
      0% { filter: brightness(1); }
      50% { filter: brightness(1.18); }
      100% { filter: brightness(1); }
    }

    h3 {
      margin: 16px 0 10px;
      color: #FFFFFF;
      letter-spacing: 0.4px;
      text-align: center;
    }

    p, li {
      color: #FFFFFF;
      opacity: 0.9;
    }

    ul {
      margin: 8px 0 0;
      padding-left: 18px;
    }

    .card-list {
      list-style: none;
      padding: 0;
      margin: 12px 0 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px;
      border-radius: 14px;
      background: #0D0D0D;
      border: 1px solid #6c5ce7;
      box-shadow: 0 8px 22px rgba(3, 19, 166, 0.18);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #10dcac;
      box-shadow: 0 14px 34px rgba(3, 19, 166, 0.28);
    }

    .card-title {
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .inline-form {
      display: inline;
      margin: 0;
    }

    .btn-small {
      width: auto;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1;
      white-space: nowrap;
    }

    .btn-danger {
      background: transparent;
      border: 1px solid #0313a6;
      color: #FFFFFF;
    }

    .btn-danger:hover {
      border-color: #10dcac;
      color: #10dcac;
      background: transparent;
    }

    .section {
      margin-top: 18px;
    }

    .greeting {
      color: #FFFFFF;
      font-size: 30px;
      text-align: center;
      margin: 0 0 18px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-wrap {
      position: relative;
    }

    .search-popout {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      z-index: 50;
      max-height: 320px;
      overflow: auto;
      background: rgba(13, 13, 13, 0.98);
      border: 1px solid #6c5ce7;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 18px 40px rgba(3, 19, 166, 0.35);
      backdrop-filter: blur(8px);
    }

    .notice {
      margin: 0 0 14px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(108, 92, 231, 0.55);
      background: rgba(13, 13, 13, 0.85);
      box-shadow: 0 14px 34px rgba(3, 19, 166, 0.18);
    }

    .notice strong {
      font-weight: 800;
      background: linear-gradient(90deg, #FFFFFF, #6c5ce7, #10dcac);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 18px rgba(108, 92, 231, 0.18);
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 20px;
      transform: translateX(-50%) translateY(-6px);
      z-index: 100;
      width: min(420px, calc(100vw - 24px));
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(16, 220, 172, 0.65);
      background: rgba(13, 13, 13, 0.92);
      box-shadow: 0 22px 44px rgba(3, 19, 166, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .home-with-nav {
      padding-bottom: 92px;
    }

    .mobile-container.has-bottom-nav main {
      padding-bottom: 110px;
    }

    .bottom-nav {
      position: sticky;
      bottom: 0;
      margin-top: auto;
      padding: 14px 20px 10px;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(10px);
      z-index: 20;
    }

    .bottom-nav::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -42px;
      height: 42px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.78));
      pointer-events: none;
    }

    .bottom-nav {
      border-top: 1px solid rgba(108, 92, 231, 0.25);
      box-shadow: 0 -14px 40px rgba(0, 0, 0, 0.55);
    }

    .bottom-nav-inner {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .nav-item,
    .nav-btn {
      appearance: none;
      width: 54px;
      height: 54px;
      border-radius: 999px;
      border: 1px solid #6c5ce7;
      background: rgba(13, 13, 13, 0.85);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      position: relative;
      box-shadow: 0 10px 22px rgba(3, 19, 166, 0.22);
      transition: transform 140ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    .nav-item:hover,
    .nav-btn:hover {
      transform: translateY(-2px);
      border-color: #10dcac;
      box-shadow: 0 16px 34px rgba(16, 220, 172, 0.16), 0 18px 40px rgba(108, 92, 231, 0.22);
      color: #10dcac;
    }

    .nav-item:active,
    .nav-btn:active {
      transform: scale(0.98);
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      color: #FFFFFF;
    }

    .nav-item:hover .nav-icon,
    .nav-btn:hover .nav-icon {
      color: #10dcac;
      filter: drop-shadow(0 0 10px rgba(16, 220, 172, 0.25));
    }

    .nav-label {
      position: absolute;
      left: 50%;
      bottom: 64px;
      transform: translateX(-50%);
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid #6c5ce7;
      background: rgba(13, 13, 13, 0.95);
      color: #FFFFFF;
      font-size: 12px;
      letter-spacing: 0.4px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease, transform 140ms ease, border-color 160ms ease, color 160ms ease;
    }

    .nav-item:hover .nav-label,
    .nav-btn:hover .nav-label {
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
      border-color: #10dcac;
      color: #10dcac;
      box-shadow: 0 14px 34px rgba(3, 19, 166, 0.28);
    }

    /* ===== FORM LAYOUT ===== */
    form {
      display: flex;
      flex-direction: column;

      /* consistent spacing between inputs */
      gap: 12px;

      margin: 0;
    }

    /* Django forms often wrap inputs in <p> tags */
    form p {
      margin: 0;
    }

    /* ===== LABELS ===== */
    label {
      display: block;

      margin: 0 0 8px;

      color: #FFFFFF;

      font-size: 14px;
    }

    /* ===== INPUT FIELDS ===== */
    input, select, textarea {
      width: 100%;

      padding: 10px;

      border-radius: 8px;

      box-sizing: border-box;

      /* dark input background */
      background: #0D0D0D;

      /* neon border */
      border: 1px solid #6c5ce7;

      color: #FFFFFF;

      outline: none;
      transition: box-shadow 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    /* focus state: green neon glow */
    input:focus {
      border-color: #10dcac;

      /* outer glow ring */
      box-shadow: 0 0 0 3px rgba(16, 220, 172, 0.2);
      transform: translateY(-1px);
    }

    textarea:focus {
      border-color: #10dcac;
      box-shadow: 0 0 0 3px rgba(16, 220, 172, 0.2);
      transform: translateY(-1px);
    }

    /* ===== PRIMARY ACTION BUTTON ===== */
    button {
      width: 100%;

      padding: 10px 12px;

      border: none;
      border-radius: 10px;

      font-size: 14px;

      /* deep blue base */
      background: #0313a6;

      color: #FFFFFF;

      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 120ms ease, box-shadow 160ms ease, background 160ms ease;
      box-shadow: 0 10px 26px rgba(3, 19, 166, 0.35);
    }

    button::after {
      content: "";
      position: absolute;
      top: -60%;
      left: -30%;
      width: 40%;
      height: 220%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: rotate(18deg) translateX(-140%);
      opacity: 0;
    }

    /* hover shifts toward purple neon */
    button:hover {
      background: #6c5ce7;
      box-shadow: 0 14px 36px rgba(108, 92, 231, 0.35);
    }

    button:hover::after {
      opacity: 1;
      animation: btnShine 900ms ease forwards;
    }

    @keyframes btnShine {
      to { transform: rotate(18deg) translateX(360%); }
    }

    button:active {
      transform: scale(0.98);
    }

    button.btn-burst {
      animation: btnBurst 520ms ease;
    }

    @keyframes btnBurst {
      0% { transform: scale(1); box-shadow: 0 10px 26px rgba(3, 19, 166, 0.35); }
      35% { transform: scale(1.02); box-shadow: 0 0 0 4px rgba(16, 220, 172, 0.18), 0 18px 44px rgba(108, 92, 231, 0.35); }
      100% { transform: scale(1); box-shadow: 0 10px 26px rgba(3, 19, 166, 0.35); }
    }

    /* ===== LINK BUTTONS (SECONDARY ACTIONS) ===== */
    a {
      display: inline-block;

      width: 95%;

      padding: 10px 12px;

      border-radius: 10px;

      font-size: 14px;

      /* transparent for outlined look */
      background: transparent;

      border: 1px solid #0313a6;

      color: #FFFFFF;

      text-decoration: none;

      text-align: center;
    }

    /* hover switches to neon green accent */
    a:hover {
      border-color: #10dcac;
      color: #10dcac;
    }

    a.card-title {
      display: inline;
      width: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      text-align: left;
    }

    a.card-title:hover {
      border: 0;
      text-decoration: underline;
    }

    /* special-case link (e.g. password reset) */
    .password-reset-link {
      width: auto;
      border-color: #6c5ce7;
    }

    .auth-links {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .auth-links a {
      flex: 1;
      width: auto;
    }

    /* ===== DJANGO FORM ERRORS ===== */
    .errorlist {
    list-style: none;
    padding: 0;
    margin: 0;
    color: #10dcac;
  }

  .helptext {
    display: block;
    margin-top: 8px;
    color: #10dcac;
    font-size: 13px;
  }

  .pw-rules {
    display: none;
    margin: 6px 0 0;
    padding: 10px 12px;
    border: 1px solid #6c5ce7;
    border-radius: 10px;
  }

  .pw-rules ul {
    margin: 0;
    padding-left: 18px;
    color: #FFFFFF;
    opacity: 0.9;
    font-size: 13px;
    line-height: 1.3;
  }

  .pw-rules li {
    margin: 4px 0;
  }

  .pw-rules li.ok {
    color: #10dcac;
    opacity: 1;
  }
  
  </style>
</head>

<body>
  <script>
    (function () {
      try {
        const offset = new Date().getTimezoneOffset();
        const maxAge = 60 * 60 * 24 * 365;
        document.cookie = `tz_offset=${offset}; path=/; max-age=${maxAge}`;
      } catch (e) {}
    })();
  </script>
  {% with current=request.resolver_match.url_name %}
  <div class="mobile-container{% if user.is_authenticated and current != 'login' and current != 'signup' %} has-bottom-nav{% endif %}">

    <!-- ===== HEADER BLOCK =====
         Default: shows logo
         Override in child templates to remove/replace header
    -->
    {% block header %}
    <div class="logo-wrap">
      <img class="logo" src="{% static 'img/sotd-logo.png' %}" alt="Song Of The Day" />
    </div>
    {% endblock %}

    <!-- ===== MAIN CONTENT BLOCK =====
         All page-specific content is injected here
    -->
    <main>
      {% block content %}{% endblock %}
    </main>

    {% if user.is_authenticated and current != 'login' and current != 'signup' %}
    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <a class="nav-item" href="{% url 'home' %}">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5"></path>
            <path d="M5 9.5V21h14V9.5"></path>
          </svg>
          <span class="nav-label">Home</span>
        </a>

        <a class="nav-item" href="{% url 'feed' %}">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 18V6"></path>
            <path d="M9 6c0-1.7 1.3-3 3-3h3v12"></path>
            <path d="M9 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"></path>
            <path d="M18 17a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"></path>
          </svg>
          <span class="nav-label">Feed</span>
        </a>

        <a class="nav-item" href="{% url 'friends_list' %}">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <path d="M8.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span class="nav-label">Friends</span>
        </a>

        <a class="nav-item" href="{% url 'account' %}">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path>
          </svg>
          <span class="nav-label">Account</span>
        </a>

        <form action="{% url 'logout' %}" method="post" style="margin:0;">
          {% csrf_token %}
          <button class="nav-btn" type="submit">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 17l5-5-5-5"></path>
              <path d="M15 12H3"></path>
              <path d="M21 3v18"></path>
            </svg>
            <span class="nav-label">Log out</span>
          </button>
        </form>
      </div>
    </nav>
    {% endif %}

  </div>
  {% endwith %}
</body>

</html>
