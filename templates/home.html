<!-- templates/home.html -->
{% extends "base.html" %}
{% load static %}

{% block title %}Home{% endblock %}

{% block content %}

{% if user.is_authenticated %}
  <div class="greeting">HI, {{ user.username }}</div>
{% else %}
  <div class="greeting">You are not logged in</div>
  <div class="actions">
    <a class="primary-link" href="{% url 'login' %}">Log In</a>
    <a href="{% url 'signup' %}">Sign Up</a>
  </div>
{% endif %}
{% endblock %}
